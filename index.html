<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cadastro de Clientes</title>
</head>
<body>
    <div class="container">
        <h1>Cadastro de Clientes</h1>
        <div class="form-group">
            <input id="nome" type="text" placeholder="Nome do cliente" required>
            <input id="email" type="email" placeholder="E-mail do cliente" required>
            <button id="salvar" type="button">Salvar Cliente</button>
        </div>

        <ul id="listaClientes">
            <!-- Clientes serão inseridos aqui via JavaScript -->
        </ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
